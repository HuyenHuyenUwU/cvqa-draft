# OFFLINE: bật loss, gradient, optimizer.
train:
  epochs: 5
  batch_size: 2
  grad_accum_steps: 8
  lr: 1.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  amp: true                    # chỉ có tác dụng trên CUDA
  num_workers: 2
  early_stopping_patience: 2
  log_every: 20
  max_train_batches: null
  max_val_batches: null
loss_weights: {answer: 1.0, localization: 0.0, rationale: 0.0, knowledge_graph: 0.0, alignment: 0.0}  # chỉ `answer` hoạt động; còn lại là placeholder
