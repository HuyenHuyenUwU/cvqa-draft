# Online inference config. Machine-local model paths go here (they are NOT stored in checkpoints' frozen towers).
checkpoint: checkpoints/exp01/best.pt
device: auto
log_level: INFO
log_file: logs/online.log
biomedclip: {local_dir: null, allow_download: false}
llm: {local_dir: null, allow_download: false, dtype: float32}
ontology_index: null                  # placeholder: no ontology index yet
generation: {max_new_tokens: 48, do_sample: false, temperature: 1.0, top_p: 1.0}
include_heatmap: false
block_on_invalid_quality: false       # false = follow the diagram (quality only feeds the Warning Generator)
image_quality:                        # heuristic thresholds (untuned, not clinical-grade)
  min_std: 0.02
  min_contrast_p95_p5: 0.15
  min_mean: 0.05
  max_mean: 0.92
  max_saturated_fraction: 0.5
  min_blur_laplacian_var: 20.0
  min_side_px: 128
scope:
  unmatched_policy: out_of_scope      # out_of_scope | in_scope  (fallback while ontology is a placeholder)
  keywords: null                      # null = built-in bone/radiology list
warnings: {confidence_threshold: 0.5} # used only once a validated confidence method exists
