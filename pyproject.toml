[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bone-cvqa"
version = "0.1.0"
description = "Bone Disease Conversational VQA - baseline tối giản để test từng thành phần của pipeline"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision", "transformers>=4.45", "pydicom>=2.4", "pillow", "opencv-python-headless", "numpy", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]
biomedclip = ["open_clip_torch", "timm"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
